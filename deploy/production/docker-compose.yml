version: "3.8"

services:
  # ──────────────────────────────────────────────
  # vLLM 推理服务（基座 + LoRA，参数对齐 DGX 生产）
  # ──────────────────────────────────────────────
  meerkat-vllm:
    image: ${VLLM_IMAGE:-qwen36-dgx-spark:v0.1.1}
    container_name: meerkat-vllm
    restart: unless-stopped
    network_mode: host
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ENABLE_MULTIMODAL=0
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:ro
      - ${LORA_DIR:-~/.cache/vllm/loras/meerkat-triz-v1}:/root/.cache/vllm/loras/meerkat-triz-v1:ro
    command: >
      python3 -m vllm.entrypoints.openai.api_server
        --model ${BASE_MODEL:-unsloth/Qwen3.6-35B-A3B-NVFP4-Fast}
        --served-model-name Qwen3.6-35B-A3B-NVFP4
        --quantization compressed-tensors
        --trust-remote-code
        --dtype bfloat16
        --max-model-len ${MAX_MODEL_LEN:-1010000}
        --hf-overrides '{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'
        --gpu-memory-utilization ${GPU_MEM_UTIL:-0.7}
        --max-num-seqs ${MAX_NUM_SEQS:-64}
        --kv-cache-dtype fp8
        --enable-lora
        --lora-modules Meerkat-TRIZ-v1-Qwen3.6-35B-A3B=/root/.cache/vllm/loras/meerkat-triz-v1/
        --max-lora-rank 64
        --enable-auto-tool-choice
        --tool-call-parser qwen3_xml
        --reasoning-parser qwen3
        --host 0.0.0.0
        --port 8888
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8888/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ──────────────────────────────────────────────
  # Open WebUI 前端
  # ──────────────────────────────────────────────
  meerkat-webui:
    image: ${WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:ollama}
    container_name: meerkat-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-12001}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - meerkat-webui-data:/app/backend/data
    environment:
      # ── 核心连接 ──
      - ENABLE_OLLAMA_API=False
      - OPENAI_API_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8888/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-local}

      # ── 应用品牌 ──
      - WEBUI_NAME=${WEBUI_NAME:-Meerkat-TRIZ}

      # ── 注册与权限 ──
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-user}
      - ENABLE_LOGIN_FORM=${ENABLE_LOGIN_FORM:-true}

      # ── HuggingFace 镜像（中国大陆加速） ──
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HUB_ENDPOINT=${HF_HUB_ENDPOINT:-https://hf-mirror.com}
    depends_on:
      meerkat-vllm:
        condition: service_healthy

volumes:
  meerkat-webui-data:
    name: meerkat-webui-data
